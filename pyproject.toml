[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = [
    "B008",  # see extend-immutable-calls below
]

[tool.ruff.lint.flake8-bugbear]
# Depends()/Security() in argument defaults is FastAPI's dependency injection
# mechanism, not the mutable-default bug B008 exists to catch.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# conftest sets environment variables that app.config reads at import time, so
# those imports must come after the assignments.
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
