name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: ticketing_test
          MYSQL_USER: ticketing
          MYSQL_PASSWORD: ticketing
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uticketing -pticketing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    env:
      DATABASE_URL: mysql+pymysql://ticketing:ticketing@127.0.0.1:3306/ticketing_test
      JWT_SECRET: ci-secret-not-used-in-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Lint
        run: ruff check app tests scripts

      - name: Test
        run: pytest -v

  build-and-push:
    needs: test          # the image is only built if the tests passed
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Image names must be lowercase, GitHub user names need not be.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
